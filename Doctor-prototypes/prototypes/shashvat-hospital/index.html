<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0F1E24">
<title>Shashvat Hospital — staff console · Sangam InfoAnalytics</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shashvat">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F1E24'/%3E%3Cpath d='M8 34h9l4-11 6 20 5-14 4 8h20' fill='none' stroke='%2300A88F' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F1E24'/%3E%3Cpath d='M8 34h9l4-11 6 20 5-14 4 8h20' fill='none' stroke='%2300A88F' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=Martian+Mono:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1E24;
  --ink-2:#22383F;
  --slate:#5C737B;
  --mute:#8CA3AA;
  --paper:#EEF3F1;
  --card:#FFFFFF;
  --line:#DBE5E2;
  --pulse:#00A88F;
  --pulse-d:#00806D;
  --pulse-w:#E2F5F1;
  --triage:#E14A32;
  --triage-w:#FDEDE9;
  --amber:#DE9B06;
  --amber-w:#FDF3DC;
  --violet:#5B54C9;
  --violet-w:#EDECFB;
  --r:14px;
  --r-s:10px;
  --shadow:0 1px 2px rgba(15,30,36,.06), 0 8px 24px -12px rgba(15,30,36,.18);
  --disp:"Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --guj:"Noto Sans Gujarati", var(--body);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:contain}
body{
  font-family:var(--body);
  background:var(--ink);
  color:var(--ink);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--disp);font-weight:700;letter-spacing:-.02em;line-height:1.15}

/* ---------- desktop staging ---------- */
.stage{min-height:100dvh;display:flex;flex-direction:column;align-items:center;background:
  radial-gradient(1200px 600px at 50% -10%, #1C3038 0%, #0F1E24 60%)}
.stage-head{width:100%;max-width:980px;padding:22px 20px 14px;display:none;align-items:center;gap:16px;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:10px;color:#fff}
.brandmark .dot{width:9px;height:9px;border-radius:50%;background:var(--pulse);box-shadow:0 0 0 4px rgba(0,168,143,.22)}
.brandmark b{font-family:var(--disp);font-size:19px;letter-spacing:-.02em}
.brandmark span{color:#8CA3AA;font-size:13px}
.stage-head .spacer{flex:1}
.switch{display:flex;gap:6px;background:rgba(255,255,255,.07);padding:5px;border-radius:12px}
.switch button{padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;color:#A8BEC4}
.switch button.on{background:#fff;color:var(--ink)}
.ghost-btn{color:#8CA3AA;font-size:13px;font-weight:600;padding:8px 12px;border:1px solid rgba(255,255,255,.14);border-radius:9px}
.ghost-btn:hover{color:#fff}

/* ---------- phone ---------- */
.phone{
  width:100%;max-width:100%;flex:1;
  background:var(--paper);
  display:flex;flex-direction:column;position:relative;overflow:hidden;
}
@media(min-width:820px){
  .stage-head{display:flex}
  .phone{
    width:412px;height:844px;flex:none;margin-bottom:34px;
    border-radius:40px;border:9px solid #060E11;
    box-shadow:0 40px 80px -30px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06);
  }
  .stage{justify-content:center}
}

#shell{flex:1;display:flex;flex-direction:column;min-height:0}

/* ---------- app bar ---------- */
.bar{background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 18px 0;position:relative;overflow:hidden;flex:none}
.bar .row{display:flex;align-items:flex-start;gap:12px;position:relative;z-index:2}
.bar h1{font-size:23px;color:#fff}
.bar .sub{font-size:12.5px;color:#93AAB1;margin-top:3px;font-weight:500}
.bar .actions{margin-left:auto;display:flex;gap:8px}
.iconbtn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.09);display:grid;place-items:center;color:#DCE7E9}
.iconbtn:active{background:rgba(255,255,255,.2)}
.backbtn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#93AAB1;margin-bottom:8px;position:relative;z-index:2}
.ecg{position:absolute;left:0;right:0;bottom:0;height:44px;opacity:.5;z-index:1;pointer-events:none}
.ecg svg{display:block;width:200%;height:44px;animation:slide 9s linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}
.bar-pad{height:18px}

/* ---------- main ---------- */
.view{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 24px;-webkit-overflow-scrolling:touch}
.stack{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
.section-h{display:flex;align-items:center;gap:10px;margin:20px 2px 10px}
.section-h h3{font-size:15px;letter-spacing:-.01em}
.section-h .link{margin-left:auto;font-size:12.5px;color:var(--pulse-d);font-weight:600}

.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card.tap:active{transform:scale(.99)}

/* metric strip */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:var(--card);border-radius:var(--r);padding:12px 13px;box-shadow:var(--shadow)}
.metric .n{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.04em;line-height:1.1}
.metric .l{display:block;font-size:11.5px;color:var(--slate);margin-top:4px;font-weight:500}
.metric.hi .n{color:var(--pulse-d)}
.metric.warn .n{color:var(--amber)}
.metric.red .n{color:var(--triage)}

/* patient row */
.prow{display:flex;align-items:center;gap:12px;padding:12px 13px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);width:100%;text-align:left}
.prow:active{background:#F7FAF9}
.tok{width:44px;height:44px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:15px;font-weight:600;flex:none;letter-spacing:-.03em}
.tok.wait{background:var(--amber-w);color:#8A6100}
.tok.done{background:var(--pulse-w);color:var(--pulse-d)}
.tok.now{background:var(--pulse);color:#fff;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{box-shadow:0 0 0 0 rgba(0,168,143,.45)}50%{box-shadow:0 0 0 7px rgba(0,168,143,0)}}
.prow .nm{display:block;font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.prow .mt{display:block;font-size:12px;color:var(--slate);margin-top:2px}
.prow .rt{margin-left:auto;text-align:right;flex:none}
.prow .rt>svg{transform:rotate(180deg)}
.rolebtn .ar svg{transform:rotate(180deg)}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;letter-spacing:.01em}
.b-wait{background:var(--amber-w);color:#8A6100}
.b-now{background:var(--pulse);color:#fff}
.b-done{background:var(--pulse-w);color:var(--pulse-d)}
.b-red{background:var(--triage-w);color:var(--triage)}
.b-vio{background:var(--violet-w);color:var(--violet)}
.b-gray{background:#EDF1F0;color:var(--slate)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;background:var(--pulse);color:#fff;font-weight:700;font-size:15px;letter-spacing:-.01em}
.btn:active{background:var(--pulse-d)}
.btn.dark{background:var(--ink)}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--triage)}
.btn.sm{padding:10px;font-size:13.5px;border-radius:10px;width:auto}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:9px}
.btnrow .btn{width:auto;flex:1}

/* chips */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:9px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.slot{font-family:var(--mono);font-size:11.5px;letter-spacing:-.03em;padding:9px 6px;flex:1;justify-content:center;text-align:center;min-width:0}
.chip.gone{background:#F1F4F3;color:#B3C1C0;text-decoration:line-through;pointer-events:none}
.scroller{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex:none}

/* forms */
.field{display:block;margin-bottom:11px}
.field .lb{font-size:11.5px;font-weight:600;color:var(--slate);margin-bottom:5px;display:block}
.inp{width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:15px;outline:none}
.inp:focus{border-color:var(--pulse);box-shadow:0 0 0 3px var(--pulse-w)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}

/* vitals */
.vitals{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.vital{border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:#fff}
.vital .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.vital input{border:0;outline:none;width:100%;font-family:var(--mono);font-size:17px;font-weight:600;letter-spacing:-.04em;padding:2px 0 0;background:none}
.vital .u{font-size:11px;color:var(--mute);font-family:var(--body);font-weight:500}

/* rx lines */
.rxline{display:flex;gap:11px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;align-items:flex-start}
.rxline .no{font-family:var(--mono);font-size:11px;color:var(--mute);padding-top:2px}
.rxline .nm{display:block;font-weight:600;font-size:14.5px}
.rxline .dz{display:block;font-size:12.5px;color:var(--slate);margin-top:3px}
.rxline .x{margin-left:auto;color:var(--mute);font-size:19px;line-height:1;padding:0 2px}
.dash{border:1px dashed var(--line);background:#fff;border-radius:12px;padding:14px;text-align:center;font-weight:600;color:var(--pulse-d);font-size:14px;width:100%}

/* prescription paper */
.rxpaper{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.rxpaper .hd{padding:14px 15px;border-bottom:2px solid var(--ink);display:flex;align-items:flex-start;gap:10px}
.rxpaper .hd .lg{width:36px;height:36px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:17px}
.rxpaper .bd{padding:15px}
.rxpaper .rx{font-family:var(--disp);font-size:26px;font-weight:800;color:var(--ink)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:3px 0}
.kv .k{color:var(--slate)}
.kv .v{font-weight:600;text-align:right}
.hair{height:1px;background:var(--line);margin:11px 0}
.guj{font-family:var(--guj)}

/* bill */
.billrow{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0}
.billrow.tot{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.03em;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.amt{font-family:var(--mono);letter-spacing:-.04em;font-weight:600}

/* charts */
.bars{display:flex;align-items:flex-end;gap:7px;height:130px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars .fill{width:100%;background:var(--pulse);border-radius:5px 5px 2px 2px;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.bars .b.peak .fill{background:var(--ink)}
.bars .lb{font-family:var(--mono);font-size:8.5px;color:var(--mute);letter-spacing:-.02em}
.hbar{margin:9px 0}
.hbar .t{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.hbar .track{height:7px;background:#EDF1F0;border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;background:var(--pulse);border-radius:4px;transition:width .7s cubic-bezier(.2,.8,.2,1)}

/* tabs */
.tabs{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 6px calc(env(safe-area-inset-bottom) + 8px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px;color:var(--mute);font-size:10.5px;font-weight:600}
.tabs button.on{color:var(--ink)}
.tabs .ic{width:22px;height:22px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(15,30,36,.45);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:22px 22px 0 0;transform:translateY(101%);transition:transform .3s cubic-bezier(.2,.9,.25,1);z-index:41;max-height:86%;display:flex;flex-direction:column}
.sheet.on{transform:translateY(0)}
.sheet .sh{padding:14px 16px 10px;flex:none}
.sheet .grip{width:38px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 11px}
.sheet .sb{padding:0 16px calc(env(safe-area-inset-bottom) + 16px);overflow-y:auto}
.sheet h3{font-size:17px}

/* toast */
.toast{position:absolute;left:50%;bottom:86px;transform:translate(-50%,14px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:11px;font-size:13.5px;font-weight:600;opacity:0;transition:all .25s;z-index:60;pointer-events:none;max-width:88%;text-align:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* misc */
.searchbar{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.searchbar input{border:0;outline:none;flex:1;font-size:14.5px;background:none}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--pulse-w);color:var(--pulse-d);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;font-family:var(--disp)}
.avatar.v{background:var(--violet-w);color:var(--violet)}
.avatar.a{background:var(--amber-w);color:#8A6100}
.tl{position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding-bottom:14px}
.tl .ev:before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid var(--pulse)}
.alert{display:flex;gap:9px;padding:11px 12px;border-radius:11px;background:var(--triage-w);color:#96301D;font-size:12.5px;font-weight:600;align-items:flex-start}
.note{font-size:12px;color:var(--slate);line-height:1.5}
.center{text-align:center}
.empty{text-align:center;padding:36px 20px;color:var(--mute)}
.empty b{display:block;color:var(--slate);font-size:15px;margin-bottom:5px;font-family:var(--disp)}
.stamp{display:inline-block;border:2px solid var(--pulse-d);color:var(--pulse-d);font-family:var(--mono);font-size:11px;font-weight:600;padding:5px 10px;border-radius:6px;transform:rotate(-6deg);letter-spacing:.04em}

/* login */
.login{flex:1;background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:32px 26px calc(env(safe-area-inset-bottom) + 26px);position:relative;overflow:hidden}
.login .glow{position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(0,168,143,.32),transparent 65%);top:-90px;right:-110px}
.login h2{font-size:34px;color:#fff;letter-spacing:-.035em;line-height:1.05}
.login p{color:#93AAB1;font-size:14px;margin:10px 0 0;max-width:88%}
.rolebtn{display:flex;align-items:center;gap:13px;width:100%;padding:15px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);text-align:left;margin-top:10px;position:relative;z-index:2}
.rolebtn:active{background:rgba(255,255,255,.16)}
.rolebtn .ri{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;background:rgba(0,168,143,.2);color:#4FE0C8}
.rolebtn .rn{display:block;font-weight:700;font-size:15px;color:#fff}
.rolebtn .rd{display:block;font-size:12px;color:#93AAB1;margin-top:2px}
.rolebtn .ar{margin-left:auto;color:#5C737B}

/* ---------- public booking page ---------- */
.pub{flex:1;display:flex;flex-direction:column;background:var(--paper);min-height:0}
.pubhead{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 13px) 15px 13px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.publogo{width:36px;height:36px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:17px;flex:none}
.pubname{font-family:var(--disp);font-weight:700;font-size:15.5px;letter-spacing:-.02em;line-height:1.2}
.pubsub{font-size:10.5px;color:var(--slate);margin-top:1px}
.pubback{width:30px;height:30px;border-radius:8px;background:var(--paper);display:grid;place-items:center;color:var(--ink-2);flex:none}
.pubexit{margin-left:auto;font-size:11px;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:7px;padding:5px 8px;flex:none}
.pubbody{flex:1;overflow-y:auto;padding:16px 16px 22px}
.pubfoot{flex:none;padding:14px 16px calc(env(safe-area-inset-bottom) + 16px);background:#fff;border-top:1px solid var(--line);font-size:11px;color:var(--mute);text-align:center;line-height:1.5}
.pubh{font-size:24px;letter-spacing:-.03em;margin-bottom:4px}
.pubp{font-size:13.5px;color:var(--slate);margin:0 0 6px;line-height:1.5}
.pubnote{font-size:11.5px;color:var(--mute);text-align:center;line-height:1.5;margin-top:12px}

.pubsteps{flex:none;display:flex;align-items:center;gap:5px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
.pstep{display:flex;align-items:center;gap:6px;flex:none}
.pdot{width:20px;height:20px;border-radius:50%;background:#E7ECEA;color:var(--mute);display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:600}
.plb{font-size:11px;font-weight:600;color:var(--mute)}
.pstep.on .pdot{background:var(--pulse);color:#fff}
.pstep.on .plb{color:var(--ink)}
.pstep.done .pdot{background:var(--pulse-w);color:var(--pulse-d)}
.pstep.done .plb{color:var(--slate)}
.pline{flex:1;height:1.5px;background:var(--line);border-radius:2px}

.doccard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.doccard:active{background:#F7FAF9}
.dnm{display:block;font-family:var(--disp);font-weight:700;font-size:15.5px;letter-spacing:-.02em}
.ddept{display:block;font-size:12.5px;color:var(--slate);margin-top:2px}
.dmeta{display:block;font-size:11.5px;color:var(--mute);margin-top:3px}
.dslots{display:inline-block;margin-top:7px;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--pulse-w);color:var(--pulse-d)}
.dslots.none{background:var(--triage-w);color:var(--triage)}

.daycard{flex:none;min-width:74px;padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:#fff;text-align:center}
.daycard .dl{display:block;font-size:12.5px;font-weight:700;letter-spacing:-.01em}
.daycard .dd{display:block;font-family:var(--mono);font-size:9.5px;color:var(--mute);margin-top:2px}
.daycard .do{display:block;font-size:9.5px;font-weight:700;color:var(--pulse-d);margin-top:5px}
.daycard .do.none{color:var(--triage)}
.daycard.on{background:var(--ink);border-color:var(--ink)}
.daycard.on .dl{color:#fff}
.daycard.on .dd,.daycard.on .do{color:#8CA3AA}
.daycard[disabled]{opacity:.42}

.slotgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:10px 4px;border-radius:11px;border:1px solid #BFE7E0;background:var(--pulse-w);text-align:center}
.slot .stime{display:block;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:-.04em;color:var(--pulse-d)}
.slot .sfill{display:block;font-size:9.5px;font-weight:600;color:var(--pulse-d);opacity:.75;margin-top:2px}
.slot.last{background:var(--amber-w);border-color:#F0DCA8}
.slot.last .stime,.slot.last .sfill{color:#8A6100}
.slot.full{background:#F1F4F3;border-color:var(--line)}
.slot.full .stime{color:#B3C1C0;text-decoration:line-through}
.slot.full .sfill{color:#B3C1C0}
.slot.pick{background:var(--ink);border-color:var(--ink)}
.slot.pick .stime,.slot.pick .sfill{color:#fff;opacity:1}

.legend{display:flex;gap:14px;justify-content:center;margin-top:14px;font-size:10.5px;color:var(--slate)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:block}
.lg-open{background:var(--pulse-w);border:1px solid #BFE7E0}
.lg-last{background:var(--amber-w);border:1px solid #F0DCA8}
.lg-full{background:#F1F4F3;border:1px solid var(--line)}

.sumcard{border-left:3px solid var(--pulse)}
.donecard{padding:24px 16px}
.tick{width:56px;height:56px;border-radius:50%;background:var(--pulse-w);color:var(--pulse-d);display:grid;place-items:center;margin:0 auto}
.refbox{margin-top:14px;font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.04em;background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:10px}
ul.plain{margin:7px 0 0;padding-left:17px;font-size:13px;color:var(--slate);line-height:1.7}

/* ---------- public booking page ---------- */
.webbar{display:flex;align-items:center;gap:8px;background:#2A3B42;padding:9px 12px;flex:none}
.webbar .wlock{color:#8CA3AA;display:flex}
.webbar .wurl{flex:1;background:#0F1E24;color:#C7D6D9;font-size:12.5px;padding:6px 11px;border-radius:20px;
  font-family:var(--mono);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.webbar .wdots{color:#8CA3AA;display:flex}
.pbhead{background:var(--ink);padding:16px 18px 20px;flex:none;position:relative;overflow:hidden}
.steps{display:flex;gap:4px;margin-bottom:14px}
.stp{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;font-weight:600;color:var(--mute);position:relative}
.stp:not(:last-child):after{content:"";position:absolute;top:11px;left:calc(50% + 14px);right:calc(-50% + 14px);height:2px;background:var(--line)}
.stp.done:not(:last-child):after{background:var(--pulse)}
.stp .dotn{width:22px;height:22px;border-radius:50%;background:#E4EAE8;color:var(--slate);display:grid;place-items:center;
  font-family:var(--mono);font-size:10.5px;font-weight:600;position:relative;z-index:2}
.stp.on{color:var(--ink)}
.stp.on .dotn{background:var(--ink);color:#fff}
.stp.done{color:var(--pulse-d)}
.stp.done .dotn{background:var(--pulse);color:#fff}

/* ---------- mobile: let the page itself scroll (one finger) ---------- */
@media(max-width:819px){
  html,body{height:auto}
  .stage{display:block;min-height:100dvh}
  .phone{display:block;height:auto;min-height:100dvh;overflow:visible;border-radius:0;border:0}
  #shell{display:block}
  .bar{position:sticky;top:0;z-index:20}
  .view{overflow:visible;height:auto;padding-bottom:calc(env(safe-area-inset-bottom) + 92px)}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30}
  .scrim,.sheet{position:fixed}
  /* login has no tab bar, so it must fill the viewport itself */
  .login{min-height:100dvh;justify-content:center}
  /* short screens must not reveal the shell background under them */
  .view{min-height:calc(100dvh - 84px)}
  .pub{display:block;min-height:100dvh}
  .pubbody{overflow:visible;height:auto}
  .pubsteps{position:sticky;top:63px;z-index:19}
  .toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 88px)}
  body.locked{overflow:hidden}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* New case vs follow-up.
   First ever visit  -> new case.
   Same doctor again -> follow-up.
   Different doctor  -> counted as a new case again. */
function caseType(pid, drId){
  const p = P(pid);
  if(!p.visits.length || !p.caseDr) return {t:"New", fee:FEE_NEW, why:"First visit at this hospital"};
  if(p.caseDr !== drId) return {t:"New", fee:FEE_NEW, why:"Different doctor from last time (" + DR(p.caseDr).nm + ") — counted as a new case"};
  return {t:"Follow-up", fee:FEE_OLD, why:"Seen earlier by " + DR(drId).nm + " on " + p.visits[0].d};
}
function caseBadge(ct){
  return ct.t === "New" ? `<span class="badge b-vio">New case · ${inr(ct.fee)}</span>`
                        : `<span class="badge b-done">Follow-up · ${inr(ct.fee)}</span>`;
}

/* Slot availability for the public page.
   Booked = taken by the desk + confirmed online requests + this session's bookings. */
function slotSeats(drId, day, slot){
  const CAP = 3;
  let used = 0;
  if(day === 0 && drId === "d1" && S.taken.includes(slot)) used = CAP;
  S.requests.forEach(r=>{ if(r.dr===drId && r.day===day && r.slot===slot && r.st!=="declined") used++; });
  S.appts.forEach(a=>{ if(day===0 && a.dr===drId && a.tm===slot) used++; });
  const h = parseInt(slot,10);
  if(used === 0 && ((h===9) || (h===18))) used = drId==="d1" ? 2 : 1;   // realistic peak load
  return {cap:CAP, used:Math.min(used,CAP), left:Math.max(CAP - used,0)};
}
function slotState(drId, day, slot){
  const s = slotSeats(drId, day, slot);
  if(!s.left) return "full";
  if(s.left === 1) return "last";
  return "open";
}

/* A slot is busy only for that one doctor — two doctors can sit at the same time. */
function slotBusy(drId, day, t){
  if(day === 0 && (S.taken[drId]||[]).includes(t)) return true;
  return S.appts.some(a => a.dr === drId && a.tm === t && (a.day||0) === day);
}
function holdSlot(drId, day, t){
  if(day !== 0) return;
  if(!S.taken[drId]) S.taken[drId] = [];
  S.taken[drId].push(t);
}

/* Duplicate detection — same mobile, or a close name at a close age. */
function normName(x){ return String(x||"").toLowerCase().replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim(); }
function findDupes(nm, ph, age){
  const n = normName(nm), digits = String(ph||"").replace(/\D/g,"");
  return S.patients.filter(p=>{
    const pd = p.ph.replace(/\D/g,"");
    if(digits && pd === digits) return true;
    const pn = normName(p.nm);
    if(!n || !pn) return false;
    const sameName = pn === n;
    const swapped  = pn.split(" ").sort().join(" ") === n.split(" ").sort().join(" ");
    return (sameName || swapped) && Math.abs((p.age||0) - (age||0)) <= 2;
  });
}

}

/* ---------------- ECG motif ---------------- */
function ecg(){
  const seg = o => `M${o},32 H${o+58} L${o+66},32 L${o+74},13 L${o+82},41 L${o+90},22 L${o+98},32 H${o+170} `
                 + `L${o+178},29 L${o+186},32 H${o+250} L${o+258},32 L${o+266},15 L${o+274},39 L${o+282},24 L${o+290},32 H${o+400}`;
  return `<div class="ecg"><svg viewBox="0 0 800 44" preserveAspectRatio="none">
    <path d="${seg(0)} ${seg(400)}" fill="none" stroke="#00A88F" stroke-width="2" stroke-linecap="round"/></svg></div>`;
}

function tabs(){
  const list = TABS[S.role]||[];

            || (root==="r_newbill"&&r==="r_bill") || (root==="r_close"&&r==="r_bill")

function paint(){

  if(S.role === "public"){
    if(!S.pb) S.pb = newPB();
    host.innerHTML = pb_shell();
    syncSwitch();

    return;
  }
  if(S.role === "public"){
    host.innerHTML = pubShell();
    syncSwitch();
    const pb = document.querySelector(".pubbody"); if(pb) pb.scrollTop = 0;
    if(window.scrollY) window.scrollTo(0,0);

  const hasNext = q.some(x=>x.st==="waiting");
  const inRoom = q.find(x=>x.st==="now");

  return `<div class="stack">
    <div class="chips">
      ${[["all","All ("+q.length+")"],["waiting","Pending"],["done","Seen"]]
        .map(([k,l])=>`<button class="chip ${f===k?"on":""}" data-act="qfilter" data-f="${k}">${l}</button>`).join("")}
    </div>
    <div class="card" style="background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px">

      <button class="btn sm" data-act="callnext" ${hasNext?"":"disabled"} style="background:var(--pulse)">Call next</button>

}

function r_desk(){

  const paid = S.bills.filter(b=>b.st==="Paid").reduce((a,b)=>a+b.amt,0);

  return `<div class="stack">
    <div class="metrics">
      <div class="metric"><div class="n">${S.appts.filter(a=>(a.day||0)===0).length}</div><div class="l">Appointments today</div></div>
      <div class="metric hi"><div class="n">${arrived}</div><div class="l">Arrived at desk</div></div>
      <div class="metric"><div class="n">${inr(paid)}</div><div class="l">Collected</div></div>
      <div class="metric red"><div class="n">${inr(due)}</div><div class="l">Pending dues</div></div>
    </div>

    <div class="btnrow" style="margin-top:6px">
      <button class="btn sm" data-act="go" data-r="r_book">${ic("plus",17)} Book</button>

function r_bill(){
  const paid = S.bills.filter(b=>b.st==="Paid").reduce((a,b)=>a+b.amt,0);
  const due  = S.bills.filter(b=>b.st==="Due").reduce((a,b)=>a+b.amt,0);
  return `<div class="stack">
    <div class="metrics">
      <div class="metric hi"><div class="n">${inr(paid)}</div><div class="l">Collected today</div></div>

    </div>
    <div class="section-h"><h3>Today's bills</h3><span class="link">${S.bills.length}</span></div>
    <div class="stack">
      ${S.bills.slice().reverse().map(b=>`<button class="prow" data-act="openbill" data-v="${b.no}">

      </button>`).join("")}
    </div>
  </div>`;
}

function r_close(){
  if(S.closed) return closedCard();
  const m = modeSplit();
  const digital = m.UPI + m.Card;
  const counted = Number(String(S.tally.cash).replace(/[^0-9.]/g,""));
  const hasCount = String(S.tally.cash).trim() !== "";
  const diff = hasCount ? counted - m.Cash : 0;
  const due = S.bills.filter(b=>b.st==="Due").reduce((a,b)=>a+b.amt,0);

  return `<div class="stack">
    <div class="card">
      <div class="eyebrow">What the system counted</div>
      <div class="billrow"><span>Cash bills</span><span class="amt">${inr(m.Cash)}</span></div>
      <div class="billrow"><span>UPI</span><span class="amt">${inr(m.UPI)}</span></div>
      <div class="billrow"><span>Card</span><span class="amt">${inr(m.Card)}</span></div>
      <div class="billrow tot"><span>Total collected</span><span>${inr(m.Cash + digital)}</span></div>
    </div>

    <div class="section-h"><h3>Count the drawer</h3></div>
    <div class="card">
      <label class="field" style="margin-bottom:0"><span class="lb">Cash actually in the drawer</span>
        <input class="inp" id="cashIn" inputmode="numeric" placeholder="${m.Cash}" value="${esc(S.tally.cash)}"
          style="font-family:var(--mono);font-size:19px"></label>
      <div class="note" style="margin-top:8px">${inr(digital)} on UPI and card is matched automatically against the machine — only cash needs counting.</div>
      <div style="height:11px"></div>
      <button class="btn line" data-act="checktally">Check difference</button>
    </div>

    ${ hasCount ? `<div class="card" style="background:${diff===0?"var(--pulse-w)":"var(--triage-w)"};border:1px solid ${diff===0?"#BFE7E0":"#F6CFC6"}">
      <div class="eyebrow" style="color:${diff===0?"var(--pulse-d)":"var(--triage)"}">${diff===0?"Drawer matches":diff<0?"Short":"Extra in drawer"}</div>
      <div style="font-family:var(--mono);font-size:28px;font-weight:600;letter-spacing:-.05em;margin:4px 0;color:${diff===0?"var(--pulse-d)":"var(--triage)"}">
        ${diff===0?"₹0":(diff<0?"− ":"+ ") + inr(Math.abs(diff))}</div>
      <div class="note">${diff===0?"Counted cash equals cash bills. Nothing to explain."
        :"The difference is recorded against this shift with the staff name and time. Nobody has to remember it tomorrow morning."}</div>
    </div>` : "" }

    ${ due ? `<div class="card flat"><div class="eyebrow">Carried forward</div>
      <div class="billrow"><span>${S.bills.filter(b=>b.st==="Due").length} unpaid bill${S.bills.filter(b=>b.st==="Due").length===1?"":"s"}</span><span class="amt">${inr(due)}</span></div>
      <div class="note">These stay open and show on the owner's screen until they are collected.</div></div>` : "" }

    <button class="btn" data-act="closeday" ${hasCount?"":"disabled"}>Close the counter for today</button>
    <div class="note center">Once closed, no bill can be back-dated into today without leaving a trace.</div>
  </div>`;
}

function closedCard(){
  const c = S.closed;
  return `<div class="stack">
    <div class="card center">
      <div class="stamp" style="margin-bottom:12px">COUNTER CLOSED · ${esc(c.tm)}</div>
      <div class="eyebrow">Collected today</div>
      <div style="font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.05em;margin:4px 0">${inr(c.total)}</div>
      <div class="note">Cash ${inr(c.cash)} · UPI ${inr(c.upi)} · Card ${inr(c.card)}</div>
    </div>
    <div class="card flat">

function a_payout(){
  const rows = DOCTORS.map(d=>{
    const today = S.queue.filter(q=>q.dr===d.id).reduce((a,q)=>a+caseType(q.pid,d.id).fee,0);
    const mtd = d.mtd + today;
    return {d, today, mtd, pay:Math.round(mtd * d.share / 100), keep:mtd - Math.round(mtd * d.share / 100)};
  });
  const totPay = rows.reduce((a,r)=>a+r.pay,0);
  const totKeep = rows.reduce((a,r)=>a+r.keep,0);
  return `<div class="stack">
    <div class="card" style="background:var(--ink);color:#fff">
      <div class="eyebrow" style="color:#4FE0C8">Payable to doctors · August so far</div>
      <div style="font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.05em;margin:4px 0">${inr(totPay)}</div>

        <span class="avatar ${r.d.id==="d2"?"v":r.d.id==="d3"?"a":""}">${initials(r.d.nm)}</span>

        <span class="badge b-gray">${r.d.share}%</span>
      </div>
      <div class="hair"></div>
      <div class="billrow"><span>Collected this month</span><span class="amt">${inr(r.mtd)}</span></div>
      <div class="billrow"><span>Of which today</span><span class="amt">${inr(r.today)}</span></div>
      <div class="billrow"><span>Hospital keeps</span><span class="amt">${inr(r.keep)}</span></div>

}

/* ---------- queue helpers ---------- */
function callNext(){
  const q = myQueue();
  const cur = q.find(x=>x.st==="now"); if(cur) cur.st = "done";
  const nx = q.find(x=>x.st==="waiting");
  if(nx){ nx.st = "now"; toast("Token " + nx.t + " called — " + P(nx.pid).nm); }
  else toast("No one else is waiting");
  paint();
}

  clearsearch(){ S.search = ""; const i=$("#pSearch"); if(i) i.value=""; const h=$("#plist"); if(h) h.innerHTML=plistHTML(); },

  /* doctor */

  patient(t){ S.viewPid = t.dataset.p; go("patient"); },
  consult(t){

  },
  comp(t){ const v=t.dataset.v, a=S.draft.comp; const i=a.indexOf(v); i<0?a.push(v):a.splice(i,1); paint(); },

  addmed(){ sheet("Add medicine", medSheet("")); },
  pickmed(t){ S.medDraft = {n:t.dataset.v, freq:"1-0-1", dur:"5 days", food:"After food"}; sheet("Dose", doseSheet()); },
  setdose(t){ S.medDraft[t.dataset.k] = t.dataset.v; sheet("Dose", doseSheet()); },
  confirmmed(){ S.draft.meds.push(Object.assign({}, S.medDraft)); closeSheet(); paint(); toast("Medicine added"); },
  rmmed(t){ S.draft.meds.splice(+t.dataset.i,1); paint(); },
  addlab(){ sheet("Advise tests", labSheet()); },
  togglelab(t){ const v=t.dataset.v, a=S.draft.labs; const i=a.indexOf(v); i<0?a.push(v):a.splice(i,1); sheet("Advise tests", labSheet()); },
  rmlab(t){ S.draft.labs.splice(+t.dataset.i,1); paint(); },

    b.step = 5; paint();
  },
  pbrestart(){ S.pb = newPB(); paint(); },

    S.bill.approved = true; closeSheet(); toast("Discount approved by owner");
    ACTIONS.makebill();
  },
  checktally(){ paint(); },
  closeday(){
    const m = modeSplit();
    const counted = Number(String(S.tally.cash).replace(/[^0-9.]/g,"")) || 0;
    S.closed = {tm:new Date().toTimeString().slice(0,5), by:DESK_STAFF,
      cash:m.Cash, upi:m.UPI, card:m.Card, total:m.Cash+m.UPI+m.Card,
      counted, diff:counted - m.Cash,
      due:S.bills.filter(b=>b.st==="Due").reduce((a,b)=>a+b.amt,0)};
    paint(); toast("Counter closed · summary sent to the owner");
  },
  reopenday(){ S.closed = null; paint(); toast("Counter reopened — this is logged"); },
  paydr(t){ toast(t.dataset.v + " marked paid"); },
  makebill(){
    const b = S.bill;
    const sub = b.items.reduce((a,i)=>a+i.r*i.q,0);
    const disc = Number(b.disc)||0;
    if(disc > DISC_LIMIT && !b.approved){ sheet("Owner approval needed", pinSheet(disc)); return; }
    const taxable = Math.max(sub-disc,0);
    const gst = b.gst ? Math.round(taxable*0.18) : 0;
    const rec = {no:"INV-2608-0" + (46 + S.bills.length - 5), pid:b.pid, items:b.items.slice(),
      sub, disc, gst, amt:taxable+gst, mode:b.mode, st:b.mode==="Pay later"?"Due":"Paid",
      tm:new Date().toTimeString().slice(0,5), by:DESK_STAFF,
      appr:disc > DISC_LIMIT ? "Owner PIN" : disc > 0 ? "Within limit" : "—"};
    S.bills.push(rec); S.lastBill = rec; go("r_receipt");
  },
  openbill(t){
    const b = S.bills.find(x=>x.no===t.dataset.v);
    S.lastBill = b.items ? b : Object.assign({}, b, {items:[{n:"Hospital services", r:b.amt, q:1}], sub:b.amt, disc:0, gst:0});
    go("r_receipt");
  },
  wabill(){ toast("Bill sent to the patient on WhatsApp"); },
  remind(t){ toast("Payment reminder sent to " + t.dataset.v); }
};

function afterPatient(target, id){
  if(target === "book"){ S.bookPid = id; paint(); }
  else if(target === "bill"){ S.bill.pid = id; S.bill.dr = billDoctorFor(id); setConsultItem(); paint(); }
  else { S.viewPid = id; go("patient"); }
}
function submitPatient(d, target){
  if(!d.nm || !d.nm.trim()){ toast("Patient name is needed"); return; }
  if(!d.ph || String(d.ph).replace(/\D/g,"").length < 10){ toast("Enter a 10-digit mobile number"); return; }
  d.target = target;
  const dupes = findDupes(d.nm, d.ph, +d.age || 0);
  if(dupes.length){ S.pending = d; sheet("Possible duplicate", dupeSheet(dupes)); return; }
  const id = createPatient(d);
  closeSheet(); afterPatient(target, id);
  toast("Patient created · charged as a new case");
}

function billDoctorFor(pid){
  const ap = S.appts.find(a=>a.pid===pid);
  return ap ? ap.dr : (P(pid).caseDr || S.doctor);
}
function setConsultItem(){
  const b = S.bill; if(!b.pid) return;
  b.items = b.items.filter(i=>!/^Consultation/.test(i.n));
  b.items.unshift(autoConsultItem(b.pid, b.dr || S.doctor));
}

/* ---------- wiring ---------- */
document.addEventListener("change", function(e){
  if(e.target.id !== "upFile") return;
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = function(){
    addReport(S.upPid, S.upType, f.name, rd.result, f.type);
    closeSheet(); paint(); toast(S.upType + " attached to the file");
  };
  rd.readAsDataURL(f);
  e.target.value = "";
});

document.addEventListener("click", function(e){
  const t = e.target.closest("[data-act]");
  if(!t) return;
  const fn = ACTIONS[t.dataset.act];
  if(!fn) return;
  e.preventDefault();
  grab();
  try{ fn(t); }catch(err){ console.error(err); toast("Something went wrong in the demo"); }
});

document.addEventListener("input", function(e){
  if(e.target.id === "pSearch"){
    S.search = e.target.value;
    const host = $("#plist");
    if(host) host.innerHTML = plistHTML();
  }
  if(e.target.id === "medSearch"){
    const host = $("#medList");
    const q = e.target.value.toLowerCase();
    const list = MEDS.filter(m=>m.toLowerCase().includes(q));
    if(host) host.innerHTML = list.length ? list.map(m=>`<button class="prow" data-act="pickmed" data-v="${esc(m)}">
        <span style="min-width:0;flex:1"><span class="nm">${esc(m)}</span></span>
        <span class="rt" style="color:var(--pulse-d)">${ic("plus",18)}</span></button>`).join("")
      : `<div class="empty"><b>Not in the list</b>In the live system your own pharmacy stock list loads here.</div>`;
  }
});

document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeSheet(); });


/* ============================================================
   Part 5 — Public booking link  (shashvat.care/book)
   A patient-facing page, NOT an app and NOT a login.
   It can only create an appointment. It can never read
   a patient file, a report, a prescription or a bill.
   ============================================================ */

const BOOK_URL = "shashvat.care/book";
const DEMO_OTP = "4321";

function newPB(){
  return {step:1, dr:null, day:0, slot:null, ph:"", sent:false, verified:false,
          nm:"", age:"", sex:"M", comp:"", pid:null, ref:null};
}

function browserBar(){
  return `<div class="webbar">
    <span class="wlock">${ic("lock",12)}</span>
    <span class="wurl">${BOOK_URL}</span>
    <span class="wdots">${ic("dots",14)}</span>
  </div>`;
}

function pb_shell(){
  const b = S.pb;
  const body = b.step===5 ? pbDone() : `${pbSteps()}${[pbDoctor,pbSlot,pbMobile,pbDetails][b.step-1]()}`;
  return `${browserBar()}
    <div class="pbhead">
      <div class="eyebrow" style="color:#4FE0C8">${HOSP_ADDR}</div>
      <h1 style="font-size:21px;color:#fff;margin-top:3px">${HOSPITAL}</h1>
      <div style="font-size:12.5px;color:#93AAB1;margin-top:2px">Book an OPD appointment</div>
    </div>
    <div class="view" id="view">${body}</div>`;
}

function pbSteps(){
  const b = S.pb, names = ["Doctor","Time","Mobile","Details"];
  return `<div class="steps">${names.map((n,i)=>{
    const k = i+1, st = k < b.step ? "done" : k === b.step ? "on" : "";
    return `<div class="stp ${st}"><span class="dotn">${k < b.step ? ic("check",12) : k}</span><span>${n}</span></div>`;
  }).join("")}</div>`;
}

/* ---- 1 · doctor ---- */
function pbDoctor(){
  return `<div class="stack">
    <div class="eyebrow" style="margin:2px">Choose a doctor</div>
    ${DOCTORS.map(d=>`<button class="prow" data-act="pbdr" data-v="${d.id}">
      <span class="avatar ${d.id==="d2"?"v":d.id==="d3"?"a":""}">${initials(d.nm)}</span>
      <span style="min-width:0"><span class="nm">${esc(d.nm)}</span>
        <span class="mt">${esc(d.dept)} · ${esc(d.room)}</span></span>
      <span class="rt">${ic("back",16)}</span></button>`).join("")}
    <div class="card flat">
      <div class="kv"><span class="k">OPD timing</span><span class="v">9 AM – 1 PM · 5 – 8 PM</span></div>
      <div class="kv"><span class="k">Consultation</span><span class="v">${inr(FEE_NEW)} new · ${inr(FEE_OLD)} follow-up</span></div>
      <div class="note" style="margin-top:7px">Nothing is paid online. You pay at the counter after the consultation.</div>
    </div>
  </div>`;
}

/* ---- 2 · slot ---- */
function pbBusy(t){ return slotBusy(S.pb.dr, S.pb.day, t); }
function pbSlot(){
  const b = S.pb, dr = DR(b.dr);
  const free = SLOTS.filter(t=>!pbBusy(t)).length;
  return `<div class="stack">
    <div class="card flat" style="display:flex;align-items:center;gap:11px">
      <span class="avatar ${dr.id==="d2"?"v":dr.id==="d3"?"a":""}">${initials(dr.nm)}</span>
      <span style="flex:1;min-width:0"><b style="display:block;font-size:14.5px">${esc(dr.nm)}</b>
        <span class="note">${esc(dr.dept)}</span></span>
      <button class="btn line sm" style="padding:7px 11px;font-size:12.5px" data-act="pbstep" data-v="1">Change</button>
    </div>

    <div class="eyebrow" style="margin:6px 2px">Choose a day</div>
    <div class="scroller">${DAYS.map(([l,s],i)=>`<button class="chip ${b.day===i?"on":""}" data-act="pbday" data-i="${i}">
      ${l}<span style="display:block;font-size:10px;font-weight:500;opacity:.7">${s}</span></button>`).join("")}</div>

    <div class="eyebrow" style="margin:12px 2px 0">Choose a time · ${free} slot${free===1?"":"s"} open</div>
    <div class="card">
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px">
        ${SLOTS.map(t=>{
          const gone = pbBusy(t);
          return `<button class="chip slot ${gone?"gone":""} ${b.slot===t?"on":""}"
            ${gone?"":`data-act="pbslot" data-v="${t}"`}>${t}</button>`;
        }).join("")}
      </div>
      <div class="note" style="margin-top:10px">Struck-off times are already taken. This updates the moment the desk books somebody else, so two people cannot take the same slot.</div>
    </div>
    <button class="btn" data-act="pbstep" data-v="3" ${b.slot?"":"disabled"}>
      ${b.slot?`Continue with ${b.slot}`:"Pick a time to continue"}</button>
  </div>`;
}

/* ---- 3 · mobile + OTP ---- */
function pbMobile(){
  const b = S.pb;
  return `<div class="stack">
    ${pbSummary()}
    <div class="card">
      <label class="field" style="margin-bottom:${b.sent?"11px":"0"}"><span class="lb">Mobile number</span>
        <input class="inp" id="pbPh" inputmode="tel" placeholder="98xxx xxxxx" value="${esc(b.ph)}"
          style="font-family:var(--mono);font-size:17px" ${b.sent?"disabled":""}></label>
      ${ b.sent ? `<label class="field" style="margin-bottom:0"><span class="lb">Enter the 4-digit code we sent</span>
          <input class="inp" id="pbOtp" inputmode="numeric" maxlength="4" placeholder="0000"
            style="font-family:var(--mono);font-size:22px;letter-spacing:.3em;text-align:center"></label>
        <div class="note center" style="margin-top:8px">Demo code is <b>${DEMO_OTP}</b>. A real code is what stops fake bookings and no-shows from blocking the doctor's day.</div>`
        : `<div class="note" style="margin-top:8px">We send a code to check the number is real. The desk calls this number if the doctor runs late.</div>` }
    </div>
    ${ b.sent ? `<button class="btn" data-act="pbverify">Verify and continue</button>
                 <button class="btn line" data-act="pbresend">Change the number</button>`
              : `<button class="btn" data-act="pbsend">Send code</button>` }
  </div>`;
}

/* ---- 4 · details ---- */
function pbDetails(){
  const b = S.pb;
  const known = b.pid ? P(b.pid) : null;
  const ct = known ? caseType(known.id, b.dr) : null;
  return `<div class="stack">
    ${pbSummary()}
    ${ known ? `<div class="card" style="background:var(--pulse-w);border:1px solid #BFE7E0">
        <div class="eyebrow" style="color:var(--pulse-d)">This number is already registered</div>
        <div style="font-family:var(--disp);font-size:17px;font-weight:700;margin:4px 0 2px">${esc(known.nm)}</div>
        <div class="note">${known.age} ${known.sex==="F"?"Female":"Male"}</div>
        <div class="hair"></div>
        <div style="display:flex;align-items:center;gap:9px">${caseBadge(ct)}
          <span class="amt" style="margin-left:auto;font-size:17px">${inr(ct.fee)}</span></div>
      </div>` : `<div class="card">
        <label class="field"><span class="lb">Patient's name</span><input class="inp" id="pbNm" placeholder="Full name" value="${esc(b.nm)}"></label>
        <div class="two">
          <label class="field" style="margin-bottom:0"><span class="lb">Age</span><input class="inp" id="pbAge" inputmode="numeric" placeholder="34" value="${esc(b.age)}"></label>
          <label class="field" style="margin-bottom:0"><span class="lb">Sex</span>
            <select class="inp" id="pbSex"><option ${b.sex==="M"?"selected":""}>M</option><option ${b.sex==="F"?"selected":""}>F</option></select></label>
        </div>
      </div>` }
    <div class="card">
      <label class="field" style="margin-bottom:0"><span class="lb">What is the problem? (optional)</span>
        <input class="inp" id="pbComp" placeholder="Fever since 3 days" value="${esc(b.comp)}"></label>
      <div class="note" style="margin-top:8px">This only helps the desk prepare. Your past visits, reports and bills are never shown on this page.</div>
    </div>
    <button class="btn" data-act="pbconfirm">Confirm booking</button>
    <div class="note center">No payment now. ${inr(known?ct.fee:FEE_NEW)} is collected at the counter.</div>
  </div>`;
}

function pbSummary(){
  const b = S.pb, dr = DR(b.dr);
  return `<div class="card flat">
    <div class="kv"><span class="k">Doctor</span><span class="v">${esc(dr.nm)}</span></div>
    <div class="kv"><span class="k">Day</span><span class="v">${DAYS[b.day][1]}</span></div>
    <div class="kv"><span class="k">Time</span><span class="v">${b.slot}</span></div>
  </div>`;
}

/* ---- 5 · confirmation ---- */
function pbDone(){
  const b = S.pb, dr = DR(b.dr), p = P(b.pid), ct = caseType(b.pid, b.dr);
  return `<div class="stack">
    <div class="card center">
      <div style="width:52px;height:52px;border-radius:50%;background:var(--pulse);color:#fff;display:grid;place-items:center;margin:2px auto 12px">${ic("check",26)}</div>
      <div style="font-family:var(--disp);font-size:20px;font-weight:700;letter-spacing:-.02em">Appointment confirmed</div>
      <div class="note" style="margin-top:6px">Booking reference</div>
      <div style="font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.03em;margin-top:2px">${b.ref}</div>
    </div>
    <div class="card">
      <div class="kv"><span class="k">Patient</span><span class="v">${esc(p.nm)}</span></div>
      <div class="kv"><span class="k">Doctor</span><span class="v">${esc(dr.nm)}</span></div>
      <div class="kv"><span class="k">Department</span><span class="v">${esc(dr.dept)}</span></div>
      <div class="kv"><span class="k">When</span><span class="v">${DAYS[b.day][1]}, ${b.slot}</span></div>
      <div class="kv"><span class="k">Room</span><span class="v">${esc(dr.room)}</span></div>
      <div class="hair"></div>
      <div class="kv"><span class="k">To pay at the counter</span><span class="v amt">${inr(ct.fee)}</span></div>
      <div class="note" style="margin-top:6px">${ct.t==="New"?"First visit with this doctor":"You have seen this doctor before"}</div>
    </div>
    <div class="card flat">
      <div class="eyebrow">Before you come</div>
      <div class="note" style="margin-top:6px">Reach 10 minutes early and give this reference at the desk.
        Bring any old reports or medicine strips you have. To reschedule or cancel, call ${HOSP_PH}.</div>
    </div>
    <button class="btn line" data-act="pbrestart">Book another appointment</button>
    <div class="note center">A confirmation message has been sent to your mobile. There is nothing to download and no account to create.</div>
  </div>`;
}

/* ---------- boot ---------- */
paint();
})();

</script>
</body>
</html>
